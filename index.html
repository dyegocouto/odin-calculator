<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/script.js" type="module"></script>
  </head>
  <body>
    <div class="wrapper">
      <div class="content-wrapper">
        <h1 class="title">JavaScript Calculator</h1>
        <div class="calculator">
          <div class="display">
            <div class="previous-line"></div>
            <div class="current-line"></div>
          </div>
          <div class="keypad">
            <button
              class="btn btn--large btn--white"
              data-value="clear"
              data-type="action"
            >
              AC
            </button>
            <button
              class="btn btn--large btn--white"
              data-value="backspace"
              data-type="action"
            >
              ⌫
            </button>
            <button class="btn" data-value="7" data-type="number">7</button>
            <button class="btn" data-value="8" data-type="number">8</button>
            <button class="btn" data-value="9" data-type="number">9</button>
            <button class="btn btn--white" data-value="/" data-type="operator">
              ÷
            </button>
            <button class="btn" data-value="4" data-type="number">4</button>
            <button class="btn" data-value="5" data-type="number">5</button>
            <button class="btn" data-value="6" data-type="number">6</button>
            <button class="btn btn--white" data-value="*" data-type="operator">
              ×
            </button>
            <button class="btn" data-value="1" data-type="number">1</button>
            <button class="btn" data-value="2" data-type="number">2</button>
            <button class="btn" data-value="3" data-type="number">3</button>
            <button class="btn btn--white" data-value="-" data-type="operator">
              –
            </button>
            <button class="btn btn" data-value="." data-type="dot">.</button>
            <button class="btn" data-value="0" data-type="number">0</button>
            <button class="btn btn--white" data-value="=" data-type="equals">
              =
            </button>
            <button class="btn btn--white" data-value="+" data-type="operator">
              +
            </button>
          </div>
        </div>
        <div class="instructions-container">
          <div class="instructions__title">Keybindings</div>
          <table class="instructions__table">
            <tbody>
              <tr>
                <td>
                  <span class="bold">1</span> to <span class="bold">9</span>
                </td>
                <td>Numbers from 1 to 9</td>
              </tr>
              <tr>
                <td><span class="bold">+ - / *</span></td>
                <td>Arithmetic operators</td>
              </tr>
              <tr>
                <td><span class="bold">.</span></td>
                <td>Decimal separator</td>
              </tr>
              <tr>
                <td>
                  <span class="bold">=</span> or
                  <span class="bold">Enter</span>
                </td>
                <td>Calculate result</td>
              </tr>
              <tr>
                <td><span class="bold">←</span></td>
                <td>Delete last digit</td>
              </tr>
              <tr>
                <td>
                  <span class="bold">Del</span> or
                  <span class="bold">C</span>
                </td>
                <td>All clear</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
